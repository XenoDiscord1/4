name: Build RecoilComp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  build-usermode:
    name: Usermode (CMake)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        working-directory: usermode
        run: cmake -B build

      - name: Build
        working-directory: usermode
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecoilComp-usermode
          path: usermode/build/Release/RecoilComp.exe

  build-driver:
    name: Kernel Driver (MSBuild + WDK)
    runs-on: windows-2022

    env:
      WDK_URL: https://go.microsoft.com/fwlink/?linkid=2196230

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install WDK
        shell: pwsh
        run: |
          $tmp = "$env:RUNNER_TEMP\wdksetup.exe"
          Invoke-WebRequest -Uri $env:WDK_URL -OutFile $tmp -UseBasicParsing
          $p = Start-Process -FilePath $tmp `
                 -ArgumentList "/features","+","/quiet","/norestart","/ceip","off" `
                 -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "WDK failed: $($p.ExitCode)"; exit 1 }

          $kits = "C:\Program Files (x86)\Windows Kits\10"

          # Найти версию SDK из Include папки
          $sdkVer = Get-ChildItem "$kits\Include" |
                    Where-Object { $_.Name -match "^\d+\.\d+\.\d+\.\d+$" } |
                    Sort-Object Name -Descending |
                    Select-Object -First 1 -ExpandProperty Name
          Write-Host "[OK] SDK version: $sdkVer"

          # Найти версию KMDF из lib папки
          $kmdfLib = Get-ChildItem "$kits\Lib\wdf\kmdf\x64" -Recurse `
                     -Filter "wdfdriverentry.lib" -ErrorAction SilentlyContinue |
                     Select-Object -First 1
          if (-not $kmdfLib) { Write-Error "wdfdriverentry.lib not found"; exit 1 }

          $m = [regex]::Match($kmdfLib.FullName, "\\x64\\([\d.]+)\\")
          $kmdfVer = $m.Groups[1].Value
          Write-Host "[OK] KMDF version: $kmdfVer"

          echo "WDK_ROOT=$kits\" >> $env:GITHUB_ENV
          echo "SDK_VER=$sdkVer" >> $env:GITHUB_ENV
          echo "KMDF_VER=$kmdfVer" >> $env:GITHUB_ENV

      - name: Build kernel driver
        shell: pwsh
        working-directory: driver
        run: |
          msbuild RecoilDriver.vcxproj `
            /nologo `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:SolutionDir="$((Get-Item ..).FullName)\" `
            /p:WdkRoot="$env:WDK_ROOT" `
            /p:SdkVer="$env:SDK_VER" `
            /p:KMDFVer="$env:KMDF_VER" `
            /verbosity:minimal `
            /m
          if ($LASTEXITCODE -ne 0) { Write-Error "MSBuild failed"; exit 1 }

      - name: Collect artifacts
        shell: pwsh
        run: |
          $sys = Get-ChildItem -Recurse -Filter "recoil.sys" | Select-Object -First 1
          if (-not $sys) { Write-Error "recoil.sys not produced"; exit 1 }
          Write-Host "[OK] $($sys.FullName)"
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $sys.FullName artifact\recoil.sys
          Copy-Item driver\install.bat   artifact\ -ErrorAction SilentlyContinue
          Copy-Item driver\uninstall.bat artifact\ -ErrorAction SilentlyContinue
          Copy-Item driver\driver.inf    artifact\ -ErrorAction SilentlyContinue

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecoilDriver-sys
          path: artifact/*
