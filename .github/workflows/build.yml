name: Build RecoilComp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  build-usermode:
    name: Usermode (CMake)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        working-directory: usermode
        run: cmake -B build

      - name: Build
        working-directory: usermode
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecoilComp-usermode
          path: usermode/build/Release/RecoilComp.exe

  build-driver:
    name: Kernel Driver (WDK + MSBuild)
    runs-on: windows-2022

    env:
      SDK_URL: https://go.microsoft.com/fwlink/?linkid=2196241
      WDK_URL: https://go.microsoft.com/fwlink/?linkid=2196230
      SDK_VER: "10.0.22621.0"

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows 11 SDK 22621
        shell: pwsh
        run: |
          $tmp = "$env:RUNNER_TEMP\sdksetup.exe"
          Invoke-WebRequest -Uri $env:SDK_URL -OutFile $tmp -UseBasicParsing
          $p = Start-Process -FilePath $tmp `
                 -ArgumentList "/features","+","/quiet","/norestart","/ceip","off" `
                 -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "SDK failed: $($p.ExitCode)"; exit 1 }
          Write-Host "[OK] SDK installed"

      - name: Install WDK 22621
        shell: pwsh
        run: |
          $tmp = "$env:RUNNER_TEMP\wdksetup.exe"
          Invoke-WebRequest -Uri $env:WDK_URL -OutFile $tmp -UseBasicParsing
          $p = Start-Process -FilePath $tmp `
                 -ArgumentList "/features","+","/quiet","/norestart","/ceip","off" `
                 -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "WDK failed: $($p.ExitCode)"; exit 1 }

          $kits = "C:\Program Files (x86)\Windows Kits\10"
          $stub = Get-ChildItem "$kits\Lib\wdf\kmdf\x64" -Recurse `
                  -Filter "wdfdriverentry.lib" -ErrorAction SilentlyContinue |
                  Select-Object -First 1

          if (-not $stub) { Write-Error "wdfdriverentry.lib not found"; exit 1 }

          $m = [regex]::Match($stub.FullName, "\\x64\\([\d.]+)\\")
          $ver = $m.Groups[1].Value
          $major = $ver.Split('.')[0]
          $minor = $ver.Split('.')[1]
          Write-Host "[OK] KMDF $major.$minor — $($stub.FullName)"
          echo "KMDF_MAJOR=$major" >> $env:GITHUB_ENV
          echo "KMDF_MINOR=$minor" >> $env:GITHUB_ENV

      - name: Install WDK.vsix into VS 2022
        shell: pwsh
        run: |
          $vsix = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Vsix" `
                    -Recurse -Filter "*.vsix" -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          if (-not $vsix) { Write-Host "[i] No vsix"; exit 0 }
          $inst = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022" `
                    -Recurse -Filter "VSIXInstaller.exe" -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          if (-not $inst) { Write-Host "[i] No VSIXInstaller"; exit 0 }
          & $inst.FullName /quiet /admin $vsix.FullName
          Write-Host "[OK] vsix done"

      - name: Build kernel driver
        shell: pwsh
        working-directory: driver
        run: |
          msbuild RecoilDriver.vcxproj `
            /nologo `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:SolutionDir="$((Get-Item ..).FullName)\" `
            /p:SignMode=Off `
            /p:KMDFVersionMajor=$env:KMDF_MAJOR `
            /p:KMDFVersionMinor=$env:KMDF_MINOR `
            /p:DriverCFlagAddOn="/wd4324 /wd4201" `
            /verbosity:minimal `
            /m
          if ($LASTEXITCODE -ne 0) { Write-Error "MSBuild failed"; exit 1 }

      - name: Collect artifacts
        shell: pwsh
        run: |
          $sys = Get-ChildItem -Recurse -Filter "recoil.sys" | Select-Object -First 1
          if (-not $sys) { Write-Error "recoil.sys not produced"; exit 1 }
          Write-Host "[OK] $($sys.FullName)"
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $sys.FullName artifact\recoil.sys
          Copy-Item driver\install.bat   artifact\ -ErrorAction SilentlyContinue
          Copy-Item driver\uninstall.bat artifact\ -ErrorAction SilentlyContinue
          Copy-Item driver\driver.inf    artifact\ -ErrorAction SilentlyContinue

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecoilDriver-sys
          path: artifact/*
