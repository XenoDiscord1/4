    - name: Install WDK 26100
      shell: pwsh
      run: |
        $tmp = "$env:RUNNER_TEMP\wdksetup.exe"
        Invoke-WebRequest -Uri $env:WDK_URL -OutFile $tmp -UseBasicParsing
        $p = Start-Process -FilePath $tmp `
               -ArgumentList "/features","+","/quiet","/norestart","/ceip","off" `
               -Wait -PassThru
        if ($p.ExitCode -ne 0) { Write-Error "WDK install failed: $($p.ExitCode)"; exit 1 }

        $kits = "C:\Program Files (x86)\Windows Kits\10"

        # найти любой stub, не привязываясь к версии
        $stub = Get-ChildItem "$kits\Lib" -Recurse -Filter "WdfDriverStub.lib" `
                -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "\\x64\\" } |
                Select-Object -First 1

        if (-not $stub) {
          Write-Host "All WdfDriverStub.lib found:"
          Get-ChildItem "$kits\Lib" -Recurse -Filter "WdfDriverStub.lib" |
            ForEach-Object { Write-Host "  $($_.FullName)" }
          Write-Error "WdfDriverStub.lib not found"; exit 1
        }

        # вытащить версию из пути: ...\KMDF\1.33\...
        $m = [regex]::Match($stub.FullName, "\\(\d+)\.(\d+)\\")
        $major = $m.Groups[1].Value
        $minor = $m.Groups[2].Value
        Write-Host "[OK] KMDF $major.$minor stub: $($stub.FullName)"

        echo "KMDF_MAJOR=$major" >> $env:GITHUB_ENV
        echo "KMDF_MINOR=$minor" >> $env:GITHUB_ENV

    - name: Build kernel driver (MSBuild)
      shell: pwsh
      working-directory: driver
      run: |
        msbuild RecoilDriver.vcxproj `
          /nologo `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:SolutionDir="$((Get-Item ..).FullName)\" `
          /p:SignMode=Off `
          /p:KMDFVersionMajor=$env:KMDF_MAJOR `
          /p:KMDFVersionMinor=$env:KMDF_MINOR `
          /p:DriverCFlagAddOn="/wd4324 /wd4201" `
          /verbosity:minimal `
          /m
        if ($LASTEXITCODE -ne 0) { Write-Error "MSBuild failed"; exit 1 }
